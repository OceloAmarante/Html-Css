<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do 
        
        <!--Tamanho padrão 300x150-->
        <iframe src="https://www.cursoemvideo.com" 
        frameborder="0">

        <!--Se o navegador não abrir o iframe de cima aí vai carregar o âncora-->
        </iframe>
        <a href="https://www.cursoemvideo.com" target="_blank"></a>
        
        para aprender a programar
    </p>
    <p>
        O meu repositório 

        <!--Abaixo existe sites que tem um bloqueio com iframes-->
        <iframe src="https://github.com/OceloAmarante?tab=repositories" 
        frameborder="0">
        </iframe>
        
        é bem legal
    </p>
</body>
</html>
